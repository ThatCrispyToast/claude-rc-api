[project]
name = "claude-rc-api"
version = "0.1.0"
description = "Unofficial Python client for the Claude Code Remote Control / Sessions API (reverse-engineered)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aniket Chadalavada" }]
keywords = ["claude", "claude-code", "remote-control", "anthropic", "unofficial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/ThatCrispyToast/claude-rc-api"
Issues = "https://github.com/ThatCrispyToast/claude-rc-api/issues"

[project.optional-dependencies]
cli = ["rich>=13.0"]
test = ["pytest>=8.0"]

[project.scripts]
claude-rc = "claude_rc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_rc"]

[tool.uv]
package = true
